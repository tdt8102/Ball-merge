<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>CatCatCat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body { margin: 0; height: 100%; background: #1d1612; overflow: hidden; touch-action: none; }
    body { display: flex; align-items: center; justify-content: center; }
    /* portrait 9:16 canvas that always fits the window */
    #unity-canvas {
      width: min(100vw, 56.25vh);
      height: min(100vh, 177.78vw);
      background: #faeed6;
      display: block;
    }
    #fatal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
             padding: 24px; background: rgba(29,22,18,.92); color: #fff; font: 600 18px sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               flex-direction: column; color: #4a3a30; font: 600 18px sans-serif; }
    #bar { width: 200px; height: 8px; background: #e2d3b8; border-radius: 4px; margin-top: 12px; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #f4b942; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="fatal" style="display:none"></div>
  <div id="loading">Loading...<div id="bar"><div id="fill"></div></div></div>
  <script>
    // If the browser drops the GPU context (low memory, app switch) the game cannot recover by itself.
    document.getElementById("unity-canvas").addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      var f = document.getElementById("fatal");
      f.textContent = "Graphics connection lost. Tap to reload.";
      f.style.display = "flex";
      f.onclick = function () { location.reload(); };
    });
  </script>
  <script src="Build/7a2dbded24d57e056180125b1583e7c4.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/c02eb1ee0adb67f4e0d0a4aba21691d9.data",
      frameworkUrl: "Build/845e61c7a4fe9f55ad6993664d637f17.framework.js",
      codeUrl: "Build/e73e6ad41f12c9653228f36c97474449.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Proto",
      productName: "CatCatCat",
      productVersion: "1.0",
      // phones report devicePixelRatio 3+: cap it to keep GPU memory / fill-rate under control
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    }, function (p) { document.getElementById("fill").style.width = (p * 100) + "%"; })
    .then(function () { document.getElementById("loading").style.display = "none"; })
    .catch(function (m) { document.getElementById("loading").textContent = "Error: " + m; });
  </script>
</body>
</html>
